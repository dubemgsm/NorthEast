<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vulnerability Map: Greater Accra, Ghana</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .nav-panel { position: absolute; top: 15px; left: 60px; z-index: 1000; display: flex; gap: 10px; }
        .nav-button { background: #007bff; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .nav-button.secondary { background: #6c757d; }
    </style>
</head>
<body>
<div class="nav-panel">
    <a href="../index.html" class="nav-button">🏠 Home</a>
    <a href="../deep_dive.html" class="nav-button secondary">📊 Deep Dive</a>
    <a href="results_charts.html" class="nav-button" style="background: #17a2b8;">📈 View Analysis Charts</a>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([2.124410900599873, 39.91239984366371], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const geojsonData = {"type": "FeatureCollection", "features": [{"type": "Feature", "properties": {"name": "Greater Accra"}, "geometry": {"type": "Polygon", "coordinates": [[[38.91239984366371, 1.124410900599873], [40.91239984366371, 1.124410900599873], [40.91239984366371, 3.124410900599873], [38.91239984366371, 3.124410900599873], [38.91239984366371, 1.124410900599873]]]}}]};
    L.geoJSON(geojsonData, {
        style: function(feature) {
            return { color: "#ff7800", weight: 2, opacity: 0.65, fillOpacity: 0.2 };
        }
    }).addTo(map);

    // Simulated Data Points
    const points = [{"lat": 1.7404938967027874, "lon": 40.53493089367996, "color": "green", "name": "School 0", "size": 5, "desc": "Status: Active | Risk: Medium"}, {"lat": 1.8538208435190398, "lon": 39.82534842971753, "color": "green", "name": "School 1", "size": 5, "desc": "Status: Active | Risk: Medium"}, {"lat": 2.873599444004534, "lon": 39.561292216548324, "color": "red", "name": "Attack 2", "size": 6, "desc": "Status: Active | Risk: Medium"}, {"lat": 2.2119837379809275, "lon": 40.67746615774822, "color": "blue", "name": "IDP Camp 3", "size": 8, "desc": "Status: Active | Risk: Medium"}, {"lat": 2.2883421637466, "lon": 40.09580866341168, "color": "red", "name": "Attack 4", "size": 6, "desc": "Status: Active | Risk: Medium"}, {"lat": 1.393089742131459, "lon": 39.54762907284513, "color": "green", "name": "School 5", "size": 5, "desc": "Status: Active | Risk: Medium"}, {"lat": 2.103519965693001, "lon": 40.60768267721891, "color": "green", "name": "School 6", "size": 5, "desc": "Status: Active | Risk: Medium"}, {"lat": 1.5364776583196913, "lon": 39.55078543674538, "color": "green", "name": "School 7", "size": 5, "desc": "Status: Active | Risk: Medium"}, {"lat": 2.460425800598602, "lon": 39.73600614853074, "color": "red", "name": "Attack 8", "size": 6, "desc": "Status: Active | Risk: Medium"}, {"lat": 2.0984359589561974, "lon": 39.776058580389744, "color": "blue", "name": "IDP Camp 9", "size": 8, "desc": "Status: Active | Risk: Medium"}, {"lat": 2.280254145802421, "lon": 39.418446259830816, "color": "red", "name": "Attack 10", "size": 6, "desc": "Status: Active | Risk: Medium"}, {"lat": 2.463182511518533, "lon": 40.242193004380596, "color": "green", "name": "School 11", "size": 5, "desc": "Status: Active | Risk: Medium"}, {"lat": 2.011240038812259, "lon": 40.4572992011913, "color": "blue", "name": "IDP Camp 12", "size": 8, "desc": "Status: Active | Risk: Medium"}, {"lat": 2.071992290634226, "lon": 40.45991592420687, "color": "blue", "name": "IDP Camp 13", "size": 8, "desc": "Status: Active | Risk: Medium"}, {"lat": 2.5861672667472853, "lon": 39.54075249851896, "color": "red", "name": "Attack 14", "size": 6, "desc": "Status: Active | Risk: Medium"}];
    points.forEach(p => {
        L.circleMarker([p.lat, p.lon], {
            radius: p.size,
            fillColor: p.color,
            color: "#000",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
        }).bindPopup(`<b>${p.name}</b><br>${p.desc}`).addTo(map);
    });
</script>
</body>
</html>
